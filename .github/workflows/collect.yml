name: Public TOI collection

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Collection mode
        type: choice
        options:
          - archive-pilot
          - sitemap-and-selected-metadata
        default: archive-pilot

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser
        run: python -m pip install 'lxml>=5,<7'
      - name: Test public daily archives
        if: inputs.mode == 'archive-pilot'
        run: python scraping/collect_archives.py --pilot
      - name: Collect public sitemaps and selected article metadata
        if: inputs.mode == 'sitemap-and-selected-metadata'
        run: |
          python scraping/collect_sitemaps.py --metadata --resume
          python scraping/combine_actual_headlines.py
      - name: Upload data and audit summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toi-${{ inputs.mode }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            scraping/output/manifest.csv
            scraping/output/summary.json
            scraping/output/run_configuration.json
            scraping/output/days/*.csv.gz
            scraping/sitemap_output/summary.json
            scraping/sitemap_output/sitemap_manifest.json
            scraping/sitemap_output/configuration.json
            scraping/sitemap_output/sitemap_url_inventory.csv.gz
            scraping/sitemap_output/actual_headlines_recent_news_feeds.csv.gz
            scraping/sitemap_output/selected_article_actual_headlines.csv.gz
            scraping/toi_actual_headlines_PARTIAL_2024_to_current.csv.gz
            scraping/actual_headlines_summary.json
